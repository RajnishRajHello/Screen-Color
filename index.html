<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Full screen</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="content">
      <div class="header">COLOR SCREEN</div>
      <div class="menue"></div>
      <div class="main">
        <div class="box">
          <div class="fullScr"></div>
          <button class="fullScrBtn">Full Screen Button</button>
          <div class="colorCatagory">
            <div class="white">white</div>
            <div class="red">red</div>
            <div class="blue">blue</div>
            <div class="green">green</div>
          </div>
          <div class="customizeColor">
            <label for="myColorPicker"
              >Customize your color =>
              <input
                type="color"
                id="myColorPicker"
                name="myColorPicker"
                value="#FFFFFF"
              />
            </label>
            <input type="text" id="colorInput" placeholder="#FFFFFF or color name">
            <button id="applyColor">Apply Color</button>
              
            
          </div>
      </div>  </div>
      </div>
      <div class="right"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
